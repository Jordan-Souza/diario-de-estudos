<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>ERP Estudos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="popup-root">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="popup-header">
    <div class="header-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">ERP Estudos</div>
      <div class="header-sub">Caderno de Erros Automatizado</div>
    </div>
    <div id="conn-badge" class="badge badge-connecting">
      <span class="badge-dot"></span>
      <span id="conn-text">Ligando</span>
    </div>
  </header>

  <!-- ── Tarefa activa ───────────────────────────────────────────────────── -->
  <div class="section">
    <div class="label">Tarefa Activa</div>
    <div id="task-display" class="task-display">
      <span id="task-name" class="task-name">Nenhuma tarefa configurada</span>
      <span id="task-disc" class="task-disc"></span>
    </div>
  </div>

  <!-- ── Contadores ─────────────────────────────────────────────────────── -->
  <div class="section">
    <div class="label">Esta Sessão</div>
    <div class="counters-grid">
      <div class="counter-card">
        <div class="counter-value" id="cnt-questoes">0</div>
        <div class="counter-label">Questões</div>
      </div>
      <div class="counter-card counter-accent">
        <div class="counter-value" id="cnt-acertos">0</div>
        <div class="counter-label">Acertos</div>
      </div>
      <div class="counter-card counter-error">
        <div class="counter-value" id="cnt-erros">0</div>
        <div class="counter-label">Erros</div>
      </div>
    </div>
  </div>

  <!-- ── Status ─────────────────────────────────────────────────────────── -->
  <div class="section">
    <div id="status-log" class="status-log status-idle">Aguardando actividade...</div>
  </div>

  <!-- ── Botão principal: Responder no TecConcursos ─────────────────────── -->
  <div class="section">
    <a id="btn-tec" href="#" target="_blank" class="btn-tec">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      Responder Questões no TecConcursos
    </a>
  </div>

  <!-- ── Acções secundárias ─────────────────────────────────────────────── -->
  <div class="section section-actions">
    <button id="btn-reset" class="btn btn-secondary">Resetar Sessão</button>
    <button id="btn-config" class="btn btn-ghost-sm">⚙ Configurar</button>
  </div>

  <!-- ── Painel de Configuração (oculto por defeito) ────────────────────── -->
  <div id="config-panel" class="config-panel hidden">
    <div class="section" style="border-bottom:none; padding-top:0;">
      <div class="label" style="margin-bottom:6px;">Token JWT</div>
      <textarea id="jwt-token" rows="3" placeholder="Cole o access_token aqui..." class="config-input"></textarea>

      <div class="label" style="margin:10px 0 6px;">ID da Tarefa (UUID)</div>
      <input id="task-id" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" class="config-input-sm" />

      <div class="label" style="margin:10px 0 6px;">URL do TecConcursos (caderno/lista)</div>
      <input id="tec-url" type="text" placeholder="https://www.tecconcursos.com.br/questoes/cadernos/..." class="config-input-sm" />

      <button id="btn-save" class="btn btn-primary" style="margin-top:12px; width:100%;">Guardar</button>
      <div id="save-msg" class="hidden" style="margin-top:8px;"></div>
    </div>
  </div>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer class="popup-footer" id="jwt-status">JWT: verificando...</footer>

</div>
<script src="popup.js"></script>
</body>
</html>
